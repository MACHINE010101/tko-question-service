spring.application.name=question-service

# Database Configuration - Use environment variables for security
# Set DB_URL, DB_USERNAME, DB_PASSWORD in your environment
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/questiondb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}

# JPA Configuration
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Logging Configuration
logging.level.com.edu.question_service=INFO
logging.level.org.springframework.web=INFO
